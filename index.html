<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#244735" />
  <title>Family Adventure</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="styles.css?v=10" />
</head>
<body>
  <main id="app">
    <section class="screen loading-screen">
      <div class="brand-mark">🧭</div>
      <p class="eyebrow">FAMILY ADVENTURE</p>
      <h2>Loading today's mission...</h2>
    </section>
  </main>

  <template id="profile-picker-template">
    <section class="screen picker-screen">
      <div class="picker-hero">
        <div class="brand-mark">🧭</div>
        <p id="holiday-label" class="eyebrow"></p>
        <h1 id="app-title"></h1>
        <p class="intro">Seven days. Seven photo missions. One family story.</p>
      </div>
      <p class="section-label">Who is exploring today?</p>
      <div id="profile-grid" class="profile-grid"></div>
    </section>
  </template>


  <template id="pin-template">
    <section class="screen pin-screen">
      <button id="back-to-picker" class="icon-button pin-back" aria-label="Back">←</button>
      <div class="pin-card">
        <div id="pin-profile-icon" class="pin-profile-icon"></div>
        <p class="eyebrow">EXPLORER CHECK-IN</p>
        <h1 id="pin-profile-name"></h1>
        <p id="pin-copy" class="intro">Enter your Explorer PIN.</p>
        <div id="pin-dots" class="pin-dots"><span></span><span></span><span></span><span></span></div>
        <input id="explorer-pin" class="pin-hidden-input" type="password" inputmode="numeric" maxlength="4" autocomplete="off">
        <div class="pin-keypad">
          <button data-number="1">1</button><button data-number="2">2</button><button data-number="3">3</button>
          <button data-number="4">4</button><button data-number="5">5</button><button data-number="6">6</button>
          <button data-number="7">7</button><button data-number="8">8</button><button data-number="9">9</button>
          <button id="pin-clear" class="pin-secondary">Clear</button><button data-number="0">0</button><button id="pin-delete" class="pin-secondary">⌫</button>
        </div>
        <button id="submit-pin" class="gallery-button">Check in</button>
        <p id="pin-error" class="admin-error hidden"></p>
        <button id="parent-override" class="admin-link">Use Parent PIN instead</button>
      </div>
    </section>
  </template>

  <template id="dashboard-template">
    <section class="screen dashboard-screen">
      <header class="topbar">
        <button id="switch-profile" class="icon-button" aria-label="End adventure">↩</button>
        <div>
          <p class="eyebrow">FAMILY ADVENTURE</p>
          <h2 id="welcome-title"></h2>
        </div>
        <div id="avatar" class="avatar"></div>
      </header>

      <section class="explorer-banner">
        <div>
          <p class="eyebrow light">EXPLORER CLASS</p>
          <strong id="explorer-role"></strong>
        </div>
        <div id="progress-count" class="progress-count"></div>
      </section>

      <nav class="day-nav" aria-label="Choose day">
        <button id="prev-day" class="day-arrow" aria-label="Previous day">‹</button>
        <div>
          <p id="day-label" class="eyebrow"></p>
          <h2 id="day-theme"></h2>
        </div>
        <button id="next-day" class="day-arrow" aria-label="Next day">›</button>
      </nav>

      <section class="mission-briefing">
        <p class="mission-stamp">PHOTO MISSION</p>
        <div class="mission-number" id="mission-number"></div>
        <h3 id="photo-title"></h3>
        <p id="photo-copy"></p>
        <div id="photo-progress" class="mission-status">○ Awaiting photo</div>
      </section>

      <section class="upload-card">
        <label class="upload-button">
          <span>📸 Take or choose photo</span>
          <input id="photo-input" type="file" accept="image/*"  />
        </label>
        <div id="photo-preview" class="preview hidden"></div>
        <button id="save-photo" class="primary-button hidden">Submit mission photo</button>
      </section>

      <section class="video-prompt card-panel">
        <div class="prompt-icon">🎥</div>
        <div>
          <p class="eyebrow">10 SECOND VIDEO DIARY</p>
          <h3 id="video-question"></h3>
          <p>Record it on your phone and save it to the Family Adventure Google Photos album.</p>
        </div>
        <button id="toggle-video" class="complete-button">Mark as recorded</button>
      </section>

      <section class="secret-mission-card">
        <button id="reveal-secret" class="secret-cover">
          <span>TOP SECRET</span>
          <strong>Secret photo mission</strong>
          <small>Tap to reveal</small>
        </button>
        <div id="secret-content" class="secret-content hidden">
          <p class="eyebrow light">YOUR MISSION FOR THE WEEK</p>
          <h3 id="secret-mission"></h3>
          <p>Do not tell anyone. Complete all five pairings without giving away your assigned subject.</p>
          <div id="secret-checklist" class="secret-checklist"></div>
        </div>
      </section>

      <section class="day-completion card-panel">
        <p class="eyebrow">TODAY'S PROGRESS</p>
        <div class="progress-list">
          <div><span id="photo-dot" class="progress-dot"></span> Photo mission</div>
          <div><span id="video-dot" class="progress-dot"></span> Video diary</div>
        </div>
        <div id="day-complete" class="day-complete hidden">MISSION COMPLETE ✓</div>
      </section>

      <button id="open-gallery" class="gallery-button">View tonight's memories</button>
      <button id="open-parent-mode" class="admin-link">🔐 Parent Mode</button>
    </section>
  </template>


  <template id="parent-template">
    <section class="screen admin-screen">
      <header class="topbar"><button id="back-from-parent" class="icon-button">←</button><div><p class="eyebrow">PARENT MODE</p><h2>Family dashboard</h2></div></header>
      <section id="parent-lock" class="card-panel admin-lock">
        <div class="prompt-icon">🔐</div><div><p class="eyebrow">PARENT ACCESS</p><h3>Enter the Parent PIN</h3><p>Progress, missions and PIN management.</p></div>
        <input id="parent-pin" class="admin-input" type="password" inputmode="numeric" maxlength="8" placeholder="Parent PIN">
        <button id="unlock-parent" class="primary-button">Open Parent Mode</button><p id="parent-error" class="admin-error hidden"></p>
      </section>
      <section id="parent-content" class="hidden">
        <nav class="admin-tabs parent-tabs"><button class="admin-tab active" data-tab="progress">Progress</button><button class="admin-tab" data-tab="daily">Daily missions</button><button class="admin-tab" data-tab="secret">Secret assignments</button><button class="admin-tab" data-tab="pins">Explorer PINs</button></nav>
        <section id="parent-panel-progress" class="admin-panel"><div id="parent-progress-grid" class="parent-progress-grid"></div><button id="refresh-progress" class="gallery-button">Refresh progress</button></section>
        <section id="parent-panel-daily" class="admin-panel hidden"><form id="daily-missions-form" class="mission-editor-list"></form><button id="save-daily-missions" class="gallery-button">Save daily missions</button><p id="daily-save-result" class="save-result hidden"></p></section>
        <section id="parent-panel-secret" class="admin-panel hidden"><form id="assignments-form" class="mission-editor-list"></form><button id="save-assignments" class="gallery-button">Save secret assignments</button><p id="assignment-save-result" class="save-result hidden"></p></section>
        <section id="parent-panel-pins" class="admin-panel hidden"><div class="admin-note">PINs are stored as hashes. Current PINs are never displayed.</div><form id="pin-manager-form" class="mission-editor-list"></form><button id="save-pin-changes" class="gallery-button">Save changed PINs</button><p id="pin-save-result" class="save-result hidden"></p><section class="mission-editor-card parent-pin-card"><div class="mission-editor-heading"><span class="mission-editor-icon">🔐</span><div><strong>Parent PIN</strong><small>Change the Parent Mode and override PIN</small></div></div><input id="new-parent-pin" type="password" inputmode="numeric" maxlength="8" placeholder="New Parent PIN"><button id="change-parent-pin" class="primary-button">Change Parent PIN</button><p id="parent-pin-result" class="save-result hidden"></p></section></section>
      </section>
    </section>
  </template>

  <template id="gallery-template">
    <section class="screen gallery-screen">
      <header class="topbar">
        <button id="back-dashboard" class="icon-button" aria-label="Back">←</button>
        <div>
          <p class="eyebrow">FAMILY GALLERY</p>
          <h2>Tonight's memories</h2>
        </div>
      </header>
      <div id="gallery-tabs" class="gallery-tabs"></div>
      <div id="gallery-grid" class="gallery-grid"></div>
      <p id="gallery-empty" class="empty-state hidden">No mission photos yet.</p>
    </section>
  </template>

  <dialog id="photo-dialog" class="photo-dialog">
    <button id="close-dialog" class="dialog-close" aria-label="Close">×</button>
    <img id="dialog-image" alt="Family adventure photo" />
    <p id="dialog-caption"></p>
  </dialog>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=10"></script>
  <script type="module" src="js/app.js?v=10"></script>
</body>
</html>
