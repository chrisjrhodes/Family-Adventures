<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#244735" />
  <title>Family Adventure</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="app"></main>

  <template id="profile-picker-template">
    <section class="screen picker-screen">
      <div class="brand-mark">FA</div>
      <p class="eyebrow">CENTER PARCS 2026</p>
      <h1>Family<br />Adventure</h1>
      <p class="intro">Choose your explorer profile.</p>
      <div id="profile-grid" class="profile-grid"></div>
    </section>
  </template>

  <template id="dashboard-template">
    <section class="screen">
      <header class="topbar">
        <button id="switch-profile" class="icon-button" aria-label="Switch profile">←</button>
        <div>
          <p class="eyebrow">FAMILY ADVENTURE</p>
          <h1 id="welcome-title">Welcome</h1>
        </div>
        <div id="avatar" class="avatar"></div>
      </header>

      <nav class="day-nav" aria-label="Choose day">
        <button id="prev-day" class="day-arrow">‹</button>
        <div>
          <p id="day-label" class="eyebrow"></p>
          <h2 id="day-theme"></h2>
        </div>
        <button id="next-day" class="day-arrow">›</button>
      </nav>

      <section class="card mission-card">
        <div class="card-icon">📸</div>
        <div>
          <p class="eyebrow">TODAY'S PHOTO THEME</p>
          <h3 id="photo-title"></h3>
          <p id="photo-copy"></p>
        </div>
      </section>

      <section class="upload-card">
        <label class="upload-button">
          <span>Take or choose photo</span>
          <input id="photo-input" type="file" accept="image/*" capture="environment" />
        </label>
        <div id="photo-preview" class="preview hidden"></div>
        <button id="save-photo" class="primary-button hidden">Save photo</button>
      </section>

      <section class="card video-card">
        <div class="card-icon">🎥</div>
        <div>
          <p class="eyebrow">10 SECOND VIDEO DIARY</p>
          <h3 id="video-question"></h3>
          <p>One take. No overthinking it.</p>
        </div>
      </section>

      <section class="upload-card">
        <label class="upload-button secondary">
          <span>Record or choose video</span>
          <input id="video-input" type="file" accept="video/*" capture="user" />
        </label>
        <div id="video-preview" class="preview hidden"></div>
        <button id="save-video" class="primary-button hidden">Save video</button>
      </section>

      <details class="secret-card">
        <summary>
          <span>🕵️ Secret mission</span>
          <span>Tap to reveal</span>
        </summary>
        <div class="secret-content">
          <p class="eyebrow">TOP SECRET</p>
          <h3 id="secret-mission"></h3>
          <p>Do not tell anyone. Candid beats staged.</p>
        </div>
      </details>

      <section class="status-row">
        <div class="status-pill" id="photo-status">Photo not saved</div>
        <div class="status-pill" id="video-status">Video not saved</div>
      </section>

      <button id="open-gallery" class="text-button">Open family gallery</button>
    </section>
  </template>

  <template id="gallery-template">
    <section class="screen">
      <header class="topbar">
        <button id="back-dashboard" class="icon-button">←</button>
        <div>
          <p class="eyebrow">FAMILY GALLERY</p>
          <h1>Holiday memories</h1>
        </div>
      </header>
      <div id="gallery-tabs" class="gallery-tabs"></div>
      <div id="gallery-grid" class="gallery-grid"></div>
      <p id="gallery-empty" class="empty-state hidden">Nothing uploaded yet.</p>
    </section>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
